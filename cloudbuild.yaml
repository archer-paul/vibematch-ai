steps:
  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/vibematch-app:$BUILD_ID', '-t', 'gcr.io/$PROJECT_ID/vibematch-app:latest', '.']

  # Push the Docker image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/vibematch-app:$BUILD_ID']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/vibematch-app:latest']

  # Deploy to Cloud Run with zero-downtime deployment
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'vibematch-ai'
      - '--image=gcr.io/$PROJECT_ID/vibematch-app:$BUILD_ID'
      - '--platform=managed'
      - '--region=europe-west9'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=20'
      - '--set-env-vars=VITE_SUPABASE_URL=https://tuqarhetglkawdnniyuz.supabase.co,VITE_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR1cWFyaGV0Z2xrYXdkbm5peXV6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTM5NzM1NzUsImV4cCI6MjA2OTU0OTU3NX0.8xiEvIip75VSQYnU7Vpdersf6ZyYXA9WuhTCXMxroxc'
      - '--no-traffic'

  # Health check on the new revision before switching traffic
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # Get the latest revision URL
        REVISION_URL=$(gcloud run revisions list --service=vibematch-ai --region=europe-west9 --format="value(status.url)" --limit=1)
        echo "Testing new revision at: $REVISION_URL"

        # Test health endpoint
        for i in {1..30}; do
          if curl -f -s "$REVISION_URL/health" > /dev/null; then
            echo "Health check passed on attempt $i"
            break
          fi
          echo "Health check failed on attempt $i, retrying in 10 seconds..."
          sleep 10
          if [ $i -eq 30 ]; then
            echo "Health check failed after 30 attempts"
            exit 1
          fi
        done

  # Switch 100% traffic to the new revision only if health check passed
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'services'
      - 'update-traffic'
      - 'vibematch-ai'
      - '--to-latest'
      - '--region=europe-west9'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

timeout: '1200s'