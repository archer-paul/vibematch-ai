steps:
  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/vibematch-app:$BUILD_ID', '-t', 'gcr.io/$PROJECT_ID/vibematch-app:latest', '.']

  # Push the Docker image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/vibematch-app:$BUILD_ID']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/vibematch-app:latest']

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'vibematch-ai'
      - '--image=gcr.io/$PROJECT_ID/vibematch-app:$BUILD_ID'
      - '--platform=managed'
      - '--region=europe-west9'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=2'
      - '--set-env-vars=VITE_SUPABASE_URL=${_VITE_SUPABASE_URL},VITE_SUPABASE_ANON_KEY=${_VITE_SUPABASE_ANON_KEY},SUPABASE_URL=${_SUPABASE_URL},OPENAI_API_KEY=${_OPENAI_API_KEY},OPENAI_MODEL=${_OPENAI_MODEL},YOUTUBE_API_KEY=${_YOUTUBE_API_KEY}'

substitutions:
  _VITE_SUPABASE_URL: ''
  _VITE_SUPABASE_ANON_KEY: ''
  _SUPABASE_URL: ''
  _OPENAI_API_KEY: ''
  _OPENAI_MODEL: 'gpt-4o-mini'
  _YOUTUBE_API_KEY: ''

options:
  logging: CLOUD_LOGGING_ONLY

timeout: '1200s'
